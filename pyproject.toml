[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arepo-camera-lab"
version = "0.2.0"
description = "Interactive WebGL camera and physical-channel explorer for portable AREPO cell scenes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Aayush Desai"}]
dependencies = ["numpy>=1.24", "h5py>=3.11"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
]

[project.scripts]
arepo-camera-lab = "arepo_camera_lab.cli:main"
arepo-camera-spline = "arepo_camera_lab.spline:main"

[project.urls]
Repository = "https://github.com/aayushdesai/arepo-camera-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
